    [2-3 oraciones — interpretación aplicada a la situación]

    🔮 Conclusión
    [2-3 oraciones — la idea final: qué hacer a continuación o en qué fijarse. Sin teatralidad.]

  greetings:
    single:
      - "La runa siempre revela la verdad. {interpretation}"
      - "Un solo signo — una sola verdad. {interpretation}"
      - "{name}, tu camino está abierto. {interpretation}"
      - "Un signo antiguo se te ha revelado, {name}. {interpretation}"
      - "El destino te habla, {name}. {interpretation}"
      - "El vidente te ha dado su respuesta, {name}. {interpretation}"

    triple:
      - "Las Nornas han leído tu hilo, {name}. {interpretation}"
      - "Tres runas — tres rostros del tiempo. {name}, tu respuesta ha llegado. {interpretation}"
      - "El pasado, el presente y el futuro se han revelado, {name}. {interpretation}"
      - "El Árbol del Mundo ha respondido tu pregunta, {name}. {interpretation}"
      - "Tres piedras han caído — tu camino se ha revelado, {name}. {interpretation}"
      - "El tiempo te habla a través de las runas, {name}. {interpretation}"

    five:
      - "La gran tirada está abierta, {name}. Las runas iluminan el camino. {interpretation}"
      - "Los elementos han señalado el camino, {name}. {interpretation}"
      - "Una tirada completa siempre es verdadera, {name}. Escucha con atención. {interpretation}"
      - "Los antiguos han revelado cinco signos para ti, {name}. {interpretation}"
      - "Una tirada profunda siempre trae una respuesta profunda, {name}. {interpretation}"
      - "Cinco runas cayeron — no por casualidad, {name}. Cada una lleva su propio mensaje. {interpretation}"